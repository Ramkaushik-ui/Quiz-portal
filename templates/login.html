<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Arena - Login</title>

<style>

/* ==============================
   COLORS
============================== */

:root {
  --primary: #0077B6;
  --primary-dark: #005f8f;
  --error: #EF4444;
  --success: #10B981;

  --bg: #F9FAFB;
  --card-bg: #FFFFFF;
  --border: #D1D5DB;

  --text-main: #111827;
  --text-secondary: #6B7280;
}


/* ==============================
   RESET
============================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


/* ==============================
   BODY
============================== */

body {

  font-family:
    'Inter',
    'Segoe UI',
    Arial,
    sans-serif;

  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #F9FAFB;

  overflow: hidden;

  position: relative;
}


/* ==============================
   ANIMATED BACKGROUND
============================== */

.quiz-background {

  position: fixed;

  inset: 0;

  overflow: hidden;

  z-index: -1;

  background:

    radial-gradient(
      circle at 15% 20%,
      rgba(0,119,182,0.20),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 80%,
      rgba(0,119,182,0.16),
      transparent 30%
    ),

    linear-gradient(
      135deg,
      #eaf7fc,
      #f9fafb,
      #edf8fc
    );
}


/* ==============================
   BACKGROUND GRID
============================== */

.quiz-background::before {

  content: "";

  position: absolute;

  inset: 0;

  background-image:

    linear-gradient(
      rgba(0,119,182,0.035) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(0,119,182,0.035) 1px,
      transparent 1px
    );

  background-size: 45px 45px;

  animation: gridMove 15s linear infinite;
}


@keyframes gridMove {

  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(45px);
  }

}


/* ==============================
   FLOATING SYMBOLS
============================== */

.floating-symbol {

  position: absolute;

  font-size: 55px;

  font-weight: 800;

  color: rgba(0,119,182,0.12);

  user-select: none;

  pointer-events: none;

  animation:
    floating 6s ease-in-out infinite;
}


/* Positions */

.symbol1 {
  top: 8%;
  left: 8%;
  animation-delay: 0s;
}

.symbol2 {
  top: 20%;
  left: 25%;
  font-size: 45px;
  animation-delay: 1s;
}

.symbol3 {
  top: 10%;
  right: 10%;
  font-size: 65px;
  animation-delay: 2s;
}

.symbol4 {
  bottom: 18%;
  left: 7%;
  font-size: 60px;
  animation-delay: 1.5s;
}

.symbol5 {
  bottom: 8%;
  right: 10%;
  font-size: 70px;
  animation-delay: 3s;
}

.symbol6 {
  top: 45%;
  left: 3%;
  font-size: 45px;
  animation-delay: 2.5s;
}

.symbol7 {
  top: 65%;
  right: 6%;
  font-size: 60px;
  animation-delay: 1s;
}

.symbol8 {
  top: 35%;
  right: 20%;
  font-size: 40px;
  animation-delay: 4s;
}

.symbol9 {
  bottom: 30%;
  right: 25%;
  font-size: 50px;
  animation-delay: 2s;
}

.symbol10 {
  top: 75%;
  left: 25%;
  font-size: 65px;
  animation-delay: 3s;
}


@keyframes floating {

  0%,
  100% {
    margin-top: 0;
    transform: rotate(0deg);
  }

  50% {
    margin-top: -25px;
    transform: rotate(8deg);
  }

}


/* ==============================
   FLOATING QUIZ CARDS
============================== */

.quiz-card-bg {

  position: absolute;

  padding: 15px 20px;

  min-width: 150px;

  background:
    rgba(255,255,255,0.60);

  backdrop-filter: blur(10px);

  -webkit-backdrop-filter: blur(10px);

  border:
    1px solid rgba(0,119,182,0.13);

  border-radius: 14px;

  color:
    rgba(0,70,110,0.55);

  box-shadow:
    0 15px 35px
    rgba(0,70,110,0.09);

  pointer-events: none;

  animation:
    quizCardFloat 8s ease-in-out infinite;
}


.quiz-card-bg span {

  display: block;

  font-size: 14px;

  font-weight: 700;
}


.quiz-card-bg div {

  margin-top: 6px;

  font-size: 12px;
}


/* Card positions */

.card1 {

  left: 6%;

  top: 35%;

  transform: rotate(-8deg);

  animation-delay: 1s;
}


.card2 {

  right: 6%;

  top: 28%;

  transform: rotate(7deg);

  animation-delay: 2s;
}


.card3 {

  left: 12%;

  bottom: 10%;

  transform: rotate(5deg);

  animation-delay: 3s;
}


@keyframes quizCardFloat {

  0%,
  100% {
    margin-top: 0;
  }

  50% {
    margin-top: -18px;
  }

}


/* ==============================
   PARTICLES
============================== */

.particle {

  position: absolute;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #0077B6;

  opacity: 0.35;

  box-shadow:
    0 0 15px
    rgba(0,119,182,0.8);

  animation:
    particleMove 8s linear infinite;
}


.p1 {
  left: 10%;
  bottom: -10px;
}

.p2 {
  left: 25%;
  bottom: -10px;
  animation-delay: 2s;
}

.p3 {
  left: 45%;
  bottom: -10px;
  animation-delay: 4s;
}

.p4 {
  left: 65%;
  bottom: -10px;
  animation-delay: 1s;
}

.p5 {
  left: 80%;
  bottom: -10px;
  animation-delay: 3s;
}

.p6 {
  left: 92%;
  bottom: -10px;
  animation-delay: 5s;
}


@keyframes particleMove {

  0% {

    transform:
      translateY(0)
      scale(0.5);

    opacity: 0;

  }

  20% {
    opacity: 0.4;
  }

  80% {
    opacity: 0.4;
  }

  100% {

    transform:
      translateY(-100vh)
      scale(1.2);

    opacity: 0;

  }

}


/* ==============================
   MAIN LOGIN CARD
============================== */

.card {

  width: 400px;

  background:
    rgba(255,255,255,0.94);

  backdrop-filter: blur(15px);

  -webkit-backdrop-filter: blur(15px);

  border-radius: 16px;

  padding: 32px;

  position: relative;

  z-index: 10;

  border:
    1px solid
    rgba(255,255,255,0.8);

  box-shadow:

    0 25px 70px
    rgba(0,70,110,0.16),

    0 5px 20px
    rgba(0,0,0,0.06);

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease;
}


.card:hover {

  transform:
    translateY(-4px);

  box-shadow:

    0 30px 80px
    rgba(0,70,110,0.20),

    0 8px 25px
    rgba(0,0,0,0.08);
}


/* ==============================
   LOGO
============================== */

.logo {

  text-align: center;

  font-size: 21px;

  font-weight: 700;

  color: var(--primary);

  margin-bottom: 32px;

  letter-spacing: 0.3px;

  text-shadow:
    0 0 20px
    rgba(0,119,182,0.15);
}


/* ==============================
   HEADING
============================== */

h1 {

  font-size: 25px;

  font-weight: 700;

  color: var(--text-main);

  margin-bottom: 24px;

  text-align: center;
}


/* ==============================
   FORM
============================== */

form {

  display: flex;

  flex-direction: column;

  gap: 16px;
}


.field {

  display: flex;

  flex-direction: column;

  gap: 5px;
}


/* ==============================
   INPUTS
============================== */

input {

  width: 100%;

  height: 46px;

  padding:
    0 13px;

  border:
    1px solid
    var(--border);

  border-radius: 9px;

  font-size: 14px;

  background: #fff;

  outline: none;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    transform 0.2s ease;
}


input::placeholder {
  color: #9CA3AF;
}


input:focus {

  border-color:
    var(--primary);

  box-shadow:

    0 0 0 3px
    rgba(0,119,182,0.10);

  transform:
    translateY(-1px);
}


input.error {

  border-color:
    var(--error);
}


/* ==============================
   ERROR MESSAGE
============================== */

.error-text {

  font-size: 12px;

  color: var(--error);

  display: none;
}


.error-text.show {
  display: block;
}


/* ==============================
   BUTTON
============================== */

button {

  height: 46px;

  background:
    var(--primary);

  color: white;

  border: none;

  border-radius: 9px;

  font-size: 16px;

  font-weight: 600;

  cursor: pointer;

  margin-top: 8px;

  transition:
    background 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}


button:hover {

  background:
    var(--primary-dark);

  transform:
    translateY(-2px);

  box-shadow:

    0 8px 20px
    rgba(0,119,182,0.25);
}


button:active {

  transform:
    scale(0.97);
}


/* ==============================
   LOGIN / SIGNUP SWITCH
============================== */

.switch-text {

  text-align: center;

  font-size: 13px;

  color:
    var(--text-secondary);

  margin-top: 18px;
}


.switch-text a {

  color:
    var(--primary);

  font-weight: 600;

  text-decoration: none;

  cursor: pointer;

  transition:
    color 0.2s ease;
}


.switch-text a:hover {

  color:
    var(--primary-dark);

  text-decoration:
    underline;
}


/* ==============================
   HIDDEN
============================== */

.hidden {
  display: none;
}


/* ==============================
   RESPONSIVE
============================== */

@media (max-width: 600px) {

  .card {

    width:
      calc(100% - 32px);

    padding:
      28px 24px;

  }

  .quiz-card-bg {
    display: none;
  }

  .floating-symbol {
    font-size: 40px;
  }

}


/* ==============================
   REDUCE ANIMATION IF NEEDED
============================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration: 0.01ms !important;

    animation-iteration-count:
      1 !important;

  }

}

</style>
</head>


<body>


<!-- =================================
     QUIZ BACKGROUND
================================== -->

<div class="quiz-background">


  <!-- Floating Symbols -->

  <div class="floating-symbol symbol1">?</div>

  <div class="floating-symbol symbol2">✓</div>

  <div class="floating-symbol symbol3">+</div>

  <div class="floating-symbol symbol4">A</div>

  <div class="floating-symbol symbol5">?</div>

  <div class="floating-symbol symbol6">★</div>

  <div class="floating-symbol symbol7">B</div>

  <div class="floating-symbol symbol8">✓</div>

  <div class="floating-symbol symbol9">C</div>

  <div class="floating-symbol symbol10">?</div>


  <!-- Floating Quiz Cards -->

  <div class="quiz-card-bg card1">

    <span>Q1</span>

    <div>
      What is the answer?
    </div>

  </div>


  <div class="quiz-card-bg card2">

    <span>
      ✓ Correct!
    </span>

  </div>


  <div class="quiz-card-bg card3">

    <span>
      10 / 20
    </span>

    <div>
      Quiz Progress
    </div>

  </div>


  <!-- Animated Particles -->

  <div class="particle p1"></div>

  <div class="particle p2"></div>

  <div class="particle p3"></div>

  <div class="particle p4"></div>

  <div class="particle p5"></div>

  <div class="particle p6"></div>

</div>



<!-- =================================
     LOGIN CARD
================================== -->

<div class="card">


  <div class="logo">
    Quiz Arena
  </div>


  <!-- =============================
       LOGIN
  ============================== -->

  <div id="loginForm">

    <h1>
      Login
    </h1>


    <form action="{{ url_for('login') }}" method="POST">
      <div class="field">
        <input name="loginEmail" type="email" id="loginEmail"
          placeholder="Email address"
          required
        >

        <span
          class="error-text"
          id="loginEmailError"
        >
          Please enter a valid email
        </span>

      </div>


      <div class="field">

        <input name="loginPassword" type="password" id="loginPassword"
          placeholder="Password"
          required
        >

        <span
          class="error-text"
          id="loginPasswordError"
        >
          Password is required
        </span>

      </div>


      <button
        type="submit"
      >
        Login
      </button>


    </form>


    <div class="switch-text">

      Don't have an account?

      <a
        onclick="showSignup()"
      >
        Sign up
      </a>

    </div>

  </div>



  <!-- =============================
       SIGNUP
  ============================== -->

  <div id="signupForm" class="hidden">
    <h1>Create Account</h1>
    <form action="{{ url_for('signup') }}" method="POST">
      <div class="field">
        <input name="signupName" type="text" id="signupName"
          placeholder="Full name"
          required
        >

      </div>


      <div class="field">

        <input name="signupEmail" type="email" id="signupEmail"
          placeholder="Email address"
          required
        >

        <span
          class="error-text"
          id="signupEmailError"
        >
          Please enter a valid email
        </span>

      </div>


      <div class="field">

        <input name="signupPassword" type="password" id="signupPassword"
          placeholder="Password"
          required
        >

      </div>


      <div class="field">

        <input name="signupConfirm" type="password" id="signupConfirm"
          placeholder="Confirm password"
          required
        >

        <span
          class="error-text"
          id="signupConfirmError"
        >
          Passwords do not match
        </span>

      </div>


      <button
        type="submit"
      >
        Sign Up
      </button>


    </form>


    <div class="switch-text">

      Already have an account?

      <a
        onclick="showLogin()"
      >
        Login
      </a>

    </div>

  </div>


</div>



<!-- =================================
     JAVASCRIPT
================================== -->

<script>


/* ==============================
   SHOW SIGNUP
============================== */

function showSignup() {

  document
    .getElementById('loginForm')
    .classList
    .add('hidden');

  document
    .getElementById('signupForm')
    .classList
    .remove('hidden');

}



/* ==============================
   SHOW LOGIN
============================== */

function showLogin() {

  document
    .getElementById('signupForm')
    .classList
    .add('hidden');

  document
    .getElementById('loginForm')
    .classList
    .remove('hidden');

}



/* ==============================
   PASSWORD VALIDATION
============================== */

document
  .querySelector('#signupForm button')
  .addEventListener(
    'click',
    function() {

      const password =
        document.getElementById(
          'signupPassword'
        );

      const confirmPassword =
        document.getElementById(
          'signupConfirm'
        );

      const error =
        document.getElementById(
          'signupConfirmError'
        );


      if (
        password.value !==
        confirmPassword.value
      ) {

        confirmPassword
          .classList
          .add('error');

        error
          .classList
          .add('show');

      }

      else {

        confirmPassword
          .classList
          .remove('error');

        error
          .classList
          .remove('show');

      }

    }
  );



/* ==============================
   MOUSE INTERACTION
============================== */

document.addEventListener(
  'mousemove',
  function(event) {


    const x =
      (event.clientX /
      window.innerWidth - 0.5) * 20;


    const y =
      (event.clientY /
      window.innerHeight - 0.5) * 20;


    /* Move symbols */

    document
      .querySelectorAll(
        '.floating-symbol'
      )
      .forEach(
        function(symbol, index) {

          const speed =
            (index + 1) * 0.15;

          symbol.style.marginLeft =
            `${x * speed}px`;

          symbol.style.marginTop =
            `${y * speed}px`;

        }
      );


    /* Move quiz cards */

    document
      .querySelectorAll(
        '.quiz-card-bg'
      )
      .forEach(
        function(card, index) {

          const speed =
            (index + 1) * 0.08;

          card.style.marginLeft =
            `${x * speed}px`;

          card.style.marginTop =
            `${y * speed}px`;

        }
      );

  }
);

</script>


</body>

</html>
